<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily 1-3-5 Sheet</title>
<style>
  @page { size: A4; margin: 14mm 16mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, 'Segoe UI', Arial, sans-serif; background: #fff; color: #3F3A34; font-size: 11pt; }
  .head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #F97316; padding-bottom: 3mm; margin-bottom: 6mm; }
  .head .t { font-weight: 800; font-size: 16pt; }
  .head .pn { font-size: 9pt; color: #8A8378; }
  .date { border: 1.5px solid #D9D2C4; border-radius: 3mm; padding: 3mm 4mm; margin-bottom: 7mm; font-size: 10pt; color: #8A8378; }
  .date b { color: #3F3A34; }
  .row { display: flex; align-items: center; gap: 4mm; margin-bottom: 5mm; }
  .box { width: 7mm; height: 7mm; border: 1.5px solid #F97316; border-radius: 1.5mm; flex-shrink: 0; }
  .lbl { width: 34mm; font-weight: 700; font-size: 10.5pt; color: #EA580C; letter-spacing: .06em; }
  .fill { flex: 1; border-bottom: 1px solid #D9D2C4; height: 9mm; }
  .big { min-height: 12mm; }
  .note { font-size: 9pt; color: #8A8378; margin-top: 2mm; }
  .foot { margin-top: 10mm; border-top: 1px solid #EBE4D8; padding-top: 3mm; font-size: 8.5pt; color: #8A8378; display: flex; justify-content: space-between; }
</style>
</head>
<body>
  <div class="head"><div class="t">Daily 1-3-5</div><div class="pn">Page 2 · Calm Week System</div></div>
  <div class="date">Date: <b>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</b> &nbsp;·&nbsp; Day: <b>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</b></div>
  <div class="note">1 big thing, 3 medium, 5 small. Finish the 1 and the 3 and the day is a win.</div>
  <div style="margin-top:6mm">
    <div class="row"><div class="box"></div><div class="lbl">1 BIG</div><div class="fill big"></div></div>
    <div class="row"><div class="box"></div><div class="lbl">3 MEDIUM</div><div class="fill"></div></div>
    <div class="row"><div class="box"></div><div class="lbl">&nbsp;</div><div class="fill"></div></div>
    <div class="row"><div class="box"></div><div class="lbl">&nbsp;</div><div class="fill"></div></div>
    <div class="row"><div class="box"></div><div class="lbl">5 SMALL</div><div class="fill"></div></div>
    <div class="row"><div class="box"></div><div class="lbl">&nbsp;</div><div class="fill"></div></div>
    <div class="row"><div class="box"></div><div class="lbl">&nbsp;</div><div class="fill"></div></div>
    <div class="row"><div class="box"></div><div class="lbl">&nbsp;</div><div class="fill"></div></div>
    <div class="row"><div class="box"></div><div class="lbl">&nbsp;</div><div class="fill"></div></div>
  </div>
  <div class="foot"><span>Calm Week System · The One-Page Week Kit</span><span>print daily, or keep in your notes app</span></div>
</body>
</html>
