<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Habit Tracker</title>
<style>
  @page { size: A4 landscape; margin: 12mm 14mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, 'Segoe UI', Arial, sans-serif; background: #fff; color: #3F3A34; font-size: 10pt; }
  .head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px solid #F97316; padding-bottom: 3mm; margin-bottom: 6mm; }
  .head .t { font-weight: 800; font-size: 16pt; }
  .head .pn { font-size: 9pt; color: #8A8378; }
  .note { font-size: 9pt; color: #8A8378; margin: 4mm 0 2mm; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th { background: #FFF7ED; color: #EA580C; font-size: 8pt; height: 7mm; }
  td { border: 1px solid #D9D2C4; height: 9mm; text-align: center; font-size: 7.5pt; color: #C9BFAE; }
  td.h { background: #FFF7ED; color: #3F3A34; font-weight: 700; text-align: left; padding-left: 3mm; }
  .foot { margin-top: 6mm; border-top: 1px solid #EBE4D8; padding-top: 3mm; font-size: 8.5pt; color: #8A8378; display: flex; justify-content: space-between; }
</style>
</head>
<body>
  <div class="head"><div class="t">Habit Tracker</div><div class="pn">Page 4 · Calm Week System</div></div>
  <div class="note">4 habits max. Tick the day. Streaks, not scores.</div>
  <table>
    <tr><th style="width:34mm">HABIT</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th><th>11</th><th>12</th><th>13</th><th>14</th><th>15</th><th>16</th><th>17</th><th>18</th><th>19</th><th>20</th><th>21</th><th>22</th><th>23</th><th>24</th><th>25</th><th>26</th><th>27</th><th>28</th><th>29</th><th>30</th><th>31</th></tr>
    <tr><td class="h">1. _____________</td><td colspan="31"></td></tr>
    <tr><td class="h">2. _____________</td><td colspan="31"></td></tr>
    <tr><td class="h">3. _____________</td><td colspan="31"></td></tr>
    <tr><td class="h">4. _____________</td><td colspan="31"></td></tr>
  </table>
  <div class="foot"><span>Calm Week System · The One-Page Week Kit</span><span>one habit at a time · two weeks minimum</span></div>
</body>
</html>
