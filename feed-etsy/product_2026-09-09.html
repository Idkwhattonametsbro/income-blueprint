<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Habit Tracker</title>
<style>
  @page { size: A4; margin: 12mm 14mm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', Arial, sans-serif; background: #fff; color: #2F2A26; }
  .brand { display: flex; align-items: center; gap: 10px; border-bottom: 3px solid #F97316; padding-bottom: 10px; margin-bottom: 18px; }
  .brand .mark { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg,#FB923C,#EA580C); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:15px; }
  .brand .nm { font-family: 'Georgia', 'Times New Roman', serif; font-weight: 700; font-size: 17pt; letter-spacing: .02em; }
  .brand .pg { margin-left: auto; font-size: 9pt; color: #8A8378; }
  .tagline { font-size: 9.5pt; color: #8A8378; margin: -10px 0 16px; }
  .card { background: #FAF9F6; border: 1px solid #E8E1D6; border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; }
  .card h2 { font-family: 'Georgia', 'Times New Roman', serif; font-size: 13pt; color: #C2410C; margin-bottom: 10px; display: flex; align-items: center; gap: 9px; }
  .card h2 .n { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg,#FB923C,#EA580C); color:#fff; font-family: Inter; font-size: 10.5pt; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .line { border-bottom: 1.5px solid #E8E1D6; height: 34px; }
  .note { font-size: 8.5pt; color: #8A8378; margin-top: 4px; }
  .foot { margin-top: 14px; border-top: 1px solid #E8E1D6; padding-top: 8px; font-size: 8pt; color: #8A8378; display: flex; justify-content: space-between; }
  .chk { display: inline-block; width: 14px; height: 14px; border: 2px solid #F97316; border-radius: 4px; margin-right: 8px; vertical-align: -2px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { border: 1px solid #E8E1D6; }
</style></head>
<body>
  <div class="brand"><div class="mark">N</div><div class="nm">Habit Tracker</div><div class="pg">Calm Week System · printable</div></div>
  
  <div class="tagline">4 habits max. Tick the day. Streaks, not scores.</div>
  <div class="card"><h2><span class="n">1</span></h2><div class="line"></div></div>
  <div class="card"><h2><span class="n">2</span></h2><div class="line"></div></div>
  <div class="card"><h2><span class="n">3</span></h2><div class="line"></div></div>
  <div class="card"><h2><span class="n">4</span></h2><div class="line"></div></div>
  <div class="card"><h2><span class="n">5</span>28-day grid</h2>
    <table><tr><td sty</tr><tr>le="hei</tr><tr>ght:22p</tr><tr>x;text-</tr></table>
  </div>

  <div class="foot"><span>Calm Week System · Habit Tracker</span><span>print at home · A4 · instant download</span></div>
</body></html>
